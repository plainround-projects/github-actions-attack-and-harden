<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="t d">
<title id="t">Three attacks, three fixes, then OIDC</title>
<desc id="d">An outside contributor on a second account sends three inputs, drawn in amber: an issue title to the Issue greeter, a fork pull request to the Fork build, and any pull request to the Labeler. Inside the hardened repository, greet.yml has permissions of nothing, pr-build.yml runs on pull_request with no secrets and sends a build-result artifact to pr-report.yml, label.yml has no checkout, and deploy.yml waits at the production environment, which needs a required reviewer. Deploy sends an OIDC token to the Cloud role and gets credentials back. It then uploads to a release bucket under releases only.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="819" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="818" rx="16"/>
<text class="title" x="48" y="68">Three attacks, three fixes, then OIDC</text>
<text class="caption" x="48" y="100">Amber: what a stranger sends. Each input meets a workflow that holds no secret or no write token.</text>
<rect class="actor" x="48" y="330" width="160" height="72" rx="36"/>
<text class="name" x="128" y="362" text-anchor="middle">Outside</text>
<text class="sub" x="128" y="384" text-anchor="middle">contributor</text>
<rect class="boundary" x="296" y="132" width="576" height="596" rx="14"/>
<text class="tag" x="312" y="160">Repository (hardened)</text>
<rect class="svc" x="320" y="184" width="208" height="92" rx="12"/>
<text class="name" x="336" y="216">Issue greeter</text>
<text class="sub" x="336" y="240">greet.yml</text>
<text class="sub" x="336" y="262">permissions: {}</text>
<rect class="svc" x="320" y="312" width="208" height="108" rx="12"/>
<text class="name" x="336" y="344">Fork build</text>
<text class="sub" x="336" y="368">pr-build.yml</text>
<text class="sub" x="336" y="390">pull_request</text>
<text class="sub" x="336" y="412">no secrets</text>
<rect class="svc" x="320" y="460" width="208" height="92" rx="12"/>
<text class="name" x="336" y="492">Labeler</text>
<text class="sub" x="336" y="516">label.yml</text>
<text class="sub" x="336" y="538">pull_request_target</text>
<rect class="svc" x="640" y="312" width="208" height="92" rx="12"/>
<text class="name" x="656" y="344">pr-report</text>
<text class="sub" x="656" y="368">workflow_run</text>
<text class="sub" x="656" y="390">validates artifact</text>
<rect class="svc" x="640" y="460" width="208" height="116" rx="12"/>
<text class="name" x="656" y="492">Deploy job</text>
<text class="sub" x="656" y="516">deploy.yml</text>
<text class="sub" x="656" y="538">id-token: write</text>
<rect class="svc" x="640" y="616" width="208" height="92" rx="12"/>
<text class="name" x="656" y="648">production</text>
<text class="sub" x="656" y="672">environment</text>
<text class="sub" x="656" y="694">required reviewer</text>
<rect class="svc" x="960" y="460" width="168" height="92" rx="12"/>
<text class="name" x="976" y="492">Cloud role</text>
<text class="sub" x="976" y="516">trust policy</text>
<text class="sub" x="976" y="538">StringEquals</text>
<path class="store" d="M952 640a88 12 0 0 1 176 0v84a88 12 0 0 1 -176 0z"/>
<path class="rim" d="M952 640a88 12 0 0 0 176 0"/>
<text class="name" x="1040" y="680" text-anchor="middle">Bucket</text>
<text class="sub" x="1040" y="702" text-anchor="middle">releases/ only</text>
<text class="sub" x="1040" y="724" text-anchor="middle">S3</text>
<rect class="note" x="48" y="560" width="232" height="124" rx="10"/>
<text class="label b t-warn" x="64" y="590">scripts/lab.sh</text>
<text class="sub" x="64" y="616">runs the attacks on</text>
<text class="sub" x="64" y="638">exploit/vulnerable,</text>
<text class="sub" x="64" y="660">then the fixes (act)</text>
<path class="fail" d="M128 330V240Q128 228 140 228H320"/>
<text class="label t-warn" x="150" y="216">issue title</text>
<path class="fail" d="M208 366H320"/>
<text class="label t-warn" x="220" y="354">fork PR</text>
<path class="fail" d="M128 402V500Q128 512 140 512H320"/>
<text class="label t-warn" x="150" y="500">any PR</text>
<path class="async" d="M528 366H640"/>
<text class="label t-accent" x="544" y="354">artifact</text>
<path class="sync" d="M744 576V616"/>
<text class="label t-accent" x="756" y="602">approval</text>
<path class="sync" d="M848 486H960"/>
<text class="label t-accent" x="858" y="474">OIDC token</text>
<path class="ok" d="M960 530H848"/>
<text class="label t-good" x="858" y="518">credentials</text>
<path class="sync" d="M848 556H890Q902 556 902 568V660Q902 672 914 672H952"/>
<text class="label t-accent" x="914" y="628">s3 sync</text>
<path class="sync" d="M48 776H112"/><text class="legend" x="124" y="781">sync call</text>
<path class="async" d="M264 776H328"/><text class="legend" x="340" y="781">async message</text>
<path class="fail" d="M696 776H760"/><text class="legend" x="772" y="781">failure path</text>
<path class="ok" d="M928 776H992"/><text class="legend" x="1004" y="781">result</text>
</svg>
