<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">A fork pull request, then a deploy</title>
<desc id="d">A numbered run across five lanes: Fork PR, pr-build and label.yml, pr-report, Deploy job and Cloud role. A fork opens a pull request (1). pr-build runs with a read-only token and no secrets (2) and uploads result.json as the artifact build-result (3). label.yml adds a label with no checkout (4). pr-report validates the artifact (5). Deploy waits at the production environment (6) and asks for an OIDC token (7). Amber: a job from another branch or fork presents a different sub and the Cloud role refuses (7x). Otherwise credentials come back for an hour (8) and aws s3 sync uploads dist to releases under the commit (9).</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="899" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="898" rx="16"/>
<text class="title" x="48" y="68">A fork pull request, then a deploy</text>
<text class="caption" x="48" y="100">One fork PR, then one deploy. Amber: a different sub, and the Cloud role refuses before issuing anything.</text>
<rect class="actor" x="385" y="128" width="150" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">Fork PR</text>
<rect class="svc" x="545" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="610" y="148" text-anchor="middle">pr-build</text>
<text class="lane" x="610" y="168" text-anchor="middle">label.yml</text>
<rect class="svc" x="710" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="770" y="158" text-anchor="middle">pr-report</text>
<rect class="svc" x="860" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="930" y="158" text-anchor="middle">Deploy job</text>
<rect class="svc" x="1028" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1088" y="148" text-anchor="middle">Cloud</text>
<text class="lane" x="1088" y="168" text-anchor="middle">role</text>
<path class="hair" d="M460 176V232M610 176V488M770 176V488M930 176V808M1088 176V744"/>
<path class="hair" d="M66 216V792"/>
<circle class="dot" cx="66" cy="216" r="15"/>
<text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">A fork opens a PR</text>
<text class="sub" x="96" y="232">a stranger's code</text>
<path class="async" d="M460 216H610"/>
<text class="label t-accent" x="476" y="206">pull_request</text>
<circle class="dot" cx="66" cy="280" r="15"/>
<text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">pr-build runs unprivileged</text>
<text class="sub" x="96" y="296">read-only token, no secrets</text>
<rect class="slot" x="604" y="262" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="285">build, test</text>
<circle class="dot" cx="66" cy="344" r="15"/>
<text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">It uploads result.json</text>
<text class="sub" x="96" y="360">artifact build-result</text>
<rect class="slot" x="604" y="326" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="349">build-result</text>
<circle class="dot" cx="66" cy="408" r="15"/>
<text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">label.yml adds a label</text>
<text class="sub" x="96" y="424">pull_request_target, no checkout</text>
<rect class="slot" x="604" y="390" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="413">label only</text>
<circle class="dot" cx="66" cy="472" r="15"/>
<text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">pr-report validates it</text>
<text class="sub" x="96" y="488">pr, sha, one of 3 outcomes</text>
<path class="async" d="M610 472H770"/>
<text class="label t-accent" x="626" y="462">artifact</text>
<rect class="slot" x="764" y="454" width="12" height="36" rx="4"/>
<text class="label t-accent" x="786" y="477">parseResult</text>
<circle class="dot" cx="66" cy="536" r="15"/>
<text class="num" x="66" y="541" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="532">Deploy waits for approval</text>
<text class="sub" x="96" y="552">environment production</text>
<rect class="slot" x="924" y="518" width="12" height="36" rx="4"/>
<text class="label t-accent" x="946" y="541">reviewer</text>
<circle class="dot" cx="66" cy="600" r="15"/>
<text class="num" x="66" y="605" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="596">Job asks for an OIDC token</text>
<text class="sub" x="96" y="616">sub names the environment</text>
<path class="sync" d="M930 600H1088"/>
<text class="label t-accent" x="946" y="590">OIDC token</text>
<circle class="dot-w" cx="66" cy="664" r="15"/>
<text class="num" x="66" y="669" text-anchor="middle">7x</text>
<text class="label b t-warn" x="96" y="660">Other branch or fork refused</text>
<text class="sub" x="96" y="680">another sub: STS says no</text>
<path class="fail" d="M1088 664H930"/>
<path class="stop" d="M1060 652V676"/>
<text class="label t-warn" x="946" y="654">sub differs</text>
<circle class="dot" cx="66" cy="728" r="15"/>
<text class="num" x="66" y="733" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="724">STS returns credentials</text>
<text class="sub" x="96" y="744">1 hour, releases/ only</text>
<path class="ok" d="M1088 728H930"/>
<text class="label t-good" x="946" y="718">1 hour</text>
<circle class="dot-g" cx="66" cy="792" r="15"/>
<text class="num" x="66" y="797" text-anchor="middle">9</text>
<text class="label b t-ink" x="96" y="788">aws s3 sync uploads dist/</text>
<text class="sub" x="96" y="808">to releases/&lt;commit&gt;/</text>
<rect class="slot" x="924" y="774" width="12" height="36" rx="4"/>
<text class="label t-accent" x="946" y="797">s3 sync</text>
<path class="ok" d="M924 792H880"/>
<rect class="win" x="590" y="772" width="290" height="40" rx="10"/>
<text class="label b t-good" x="606" y="797">build in releases/&lt;commit&gt;/</text>
<path class="sync" d="M48 856H112"/><text class="legend" x="124" y="861">sync call</text>
<path class="async" d="M264 856H328"/><text class="legend" x="340" y="861">async message</text>
<path class="fail" d="M696 856H760"/><text class="legend" x="772" y="861">failure path</text>
<path class="ok" d="M928 856H992"/><text class="legend" x="1004" y="861">result</text>
</svg>
