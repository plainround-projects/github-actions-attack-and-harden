name: pr-report

# Fix 2, the reporting half. pr-build.yml (unprivileged) uploads result.json; this workflow (privileged, it can comment)
# runs from the default branch, never checks out the pull request, and treats the artifact as untrusted data: the
# script accepts only an integer pull request number, a 40-character hash and one of three words.
on:
  workflow_run:
    workflows: [pr-build]
    types: [completed]

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # download the artifact of the run that triggered this one
      pull-requests: write # post the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-result
          path: result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: npx tsx pipeline/post-result-cli.ts result/result.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
