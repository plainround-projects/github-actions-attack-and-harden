name: greet

# Fix 1 for attack 1. The issue title is data: it goes into an environment variable and the shell reads it as $TITLE,
# so no character in it can change the structure of the command. The job needs no token scope at all.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          echo "New issue: $TITLE"
